name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch:
    inputs:
      peons:
        description: "Space-separated peon names to score; empty scores all"
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
  peons-fixtures:
    # Manual only: scoring calls a live model and costs money, so peon authors verify
    # locally with their own key before pushing. Run from the Actions tab when wanted.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: changed
        name: Work out which peons to score
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            names="${{ github.event.inputs.peons }}"
          else
            names=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- peons/ | awk -F/ 'NF>1 {print $2}' | sort -u | tr '\n' ' ')
          fi
          # Only plain peon directory names may reach the next step.
          for n in $names; do
            case "$n" in *[!A-Za-z0-9_-]*) echo "invalid peon name: $n"; exit 1;; esac
          done
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          if [ -z "${names// }" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No peon changed; nothing to score."
          fi
      - name: Score changed peons against the live model
        if: steps.changed.outputs.skip != 'true'
        env:
          PEONS_API_KEY: ${{ secrets.PEONS_API_KEY }}
          NAMES: ${{ steps.changed.outputs.names }}
        run: |
          case "$NAMES" in *[!A-Za-z0-9_\ -]*) echo "invalid peon name"; exit 1;; esac
          bun packages/cli/src/index.ts test $NAMES --runs 2 --format json > peons-test.json
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.skip != 'true'
        with: { name: peons-test, path: peons-test.json }
  dogfood:
    # Manual only for the same reason as peons-fixtures.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && cd packages/action && bun run build
      - uses: ./packages/action
        with: { api-key: "${{ secrets.PEONS_API_KEY }}", soft-fail: "true" }
